name: Test

# PR-gate CI for this repo: a `pytest` job whose check name feeds the
# code-review-reusable.yml loop's `ci_check_name` input (see code-review.yml
# in this same directory), plus a report-only `lint` job.
#
# REPLACES this repo's previous `test.yml` (a copy of aw-app-template's own
# fail_under=100 coverage gate). That gate is a template-only standard
# (docs/standards/pipeline-testing.md Phase 1, not yet rolled to the fleet —
# see aw-app-* fleet migration DESIGN.md §2/§4.1) rather than this repo's
# own decision, and the fleet migration deliberately uses the simpler
# agents-platform-runners shape (no coverage gate) for every repo in this
# batch, deferring the coverage-gate rollout to that standard's own Phase 2.
#
# No `paths:` filter on `pull_request`, deliberately: the review/merge loop
# requires this job's check to be PRESENT and passing before it will merge
# ("absent" must never read as "fine" — see code-review.yml's `ci_check_name`
# comment). A paths filter would let a docs-only PR never produce this check
# at all.
#
# `ubuntu-latest`, NOT `[self-hosted, aw-baremetal]`: this repo is PUBLIC and
# `pull_request` has no fork restriction here — a fork-authored PR's own
# `tests/`/install step would otherwise execute directly on the self-hosted
# baremetal pool, a known way to compromise self-hosted CI infrastructure.
# GitHub-hosted minutes are free on a public repo, so there is no cost
# reason to prefer self-hosted here anyway.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -q pytest jsonschema fastapi httpx uvicorn
          if [ -f requirements.txt ]; then
            pip install -q -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -q -r requirements-dev.txt
          fi

      - name: Run test suite
        run: python3 -m pytest tests/ -q

  # Report-only, same rationale as the reference repo's own `lint` job:
  # ruff with its own defaults needs no repo config and gives a baseline
  # without inventing an un-triaged blocking gate as a side effect of
  # adding CI.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ruff check (report-only)
        run: |
          pip install -q ruff
          python -m ruff check . || true
