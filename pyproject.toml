[tool.pytest.ini_options]
# The bridge is tested against a real stdio child process, so most of its
# tests are async. asyncio_mode=auto would also work; the explicit marker
# keeps it visible which tests own an event loop.
asyncio_mode = "strict"
# These tests spawn, kill and abandon REAL child processes on purpose (that is
# the bridge's whole risk surface). pytest-asyncio closes a fresh event loop
# per test, and any subprocess transport the interpreter only gets around to
# collecting AFTER that raises "Event loop is closed" from its __del__ — an
# UNRAISABLE exception, so it is reported against whichever test happened to
# be running when the GC reached it, not the one that created it. Green run,
# scary red annotation, misleading attribution.
#
# Suppressed narrowly and deliberately: production never closes its loop (the
# bridge's child lives for the life of the workspace process), so this cannot
# mask a real defect. Do NOT widen this to all warnings.
filterwarnings = [
    "error",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["codegraph_app"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
# Exemptions 1-4 from docs/standards/pipeline-testing.md §3 (glue, properties,
# dunder reprs, pure re-exports) — the same set aw-app-template carries.
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "if __name__ == .__main__",
    "raise NotImplementedError",
    "except ImportError",
]
show_missing = true
precision = 1
# A hard 100% gate, not the estate's 80% floor (docs/standards/
# pipeline-testing.md §4.2). This app's whole risk surface is the MCP
# bridge's process lifecycle — a child that dies mid-session, a second
# handshake, two callers' ids crossing — and that is covered by tests driving
# a REAL stdio child (tests/fake_mcp_child.py), not import-only stubs. It
# measured 100% on adoption (2026-10-05), so the gate locks that in rather
# than leaving slack it doesn't need. Ratchet only: never lower this without
# a documented reason.
fail_under = 100
